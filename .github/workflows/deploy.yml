name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Flip to 'true' once surferelement.com's DNS is pointed at
          # GitHub Pages and the custom domain is verified in this repo's
          # Settings → Pages (see README.md). Until then this must stay
          # 'false' so the build's base path matches where it's actually
          # served (the citizen4004.github.io/surfer-element-website/
          # subpath) — see astro.config.mjs and src/lib/url.ts for why.
          USE_CUSTOM_DOMAIN: 'false'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
